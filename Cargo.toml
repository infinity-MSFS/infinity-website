[package]
name = "infinity-website"
description = "The Infinity simulations website"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Infinity Simulations"]
publish = false

[dependencies]
infinity-ui = { path = "../infinity-ui-wasm/crates/infinity-ui", features = ["csr"] }
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "AddEventListenerOptions",
  "Blob",
  "BlobPropertyBag",
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "FocusEvent",
  "History",
  "HtmlAnchorElement",
  "HtmlButtonElement",
  "HtmlCanvasElement",
  "HtmlDivElement",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MouseEvent",
  "Navigator",
  "Node",
  "NodeList",
  "PointerEvent",
  "ScrollBehavior",
  "ScrollToOptions",
  "Storage",
  "Url",
  "UrlSearchParams",
  "Window",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = false

[profile.dev.package."*"]
opt-level = 1

[profile.dev.package.infinity-ui]
opt-level = 0
