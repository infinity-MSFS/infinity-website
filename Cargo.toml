[package]
name = "infinity-website"
description = "The Infinity simulations website"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Infinity Simulations"]
publish = false

[dependencies]
infinity-ui = { path = "../infinity-ui-wasm/crates/infinity-ui", features = ["csr"] }
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "History",
  "HtmlElement",
  "Location",
  "Navigator",
  "Storage",
  "Window",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
